[package]
name = "web-ui-service"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = { version = "0.36", default-features = false, features = ["rwh_06"] }
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false }
wry = { version = "0.56.1", default-features = false, features = ["os-webview"] }
