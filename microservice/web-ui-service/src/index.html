<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebSupervisor 控制台</title>
  <style>
    :root { color-scheme: dark; --bg:#0d1113; --panel:#151c1f; --panel-2:#101618; --line:#29363a; --text:#e8efed; --muted:#8fa19d; --green:#6ee7a0; --amber:#f4c56c; --red:#ff7d7d; --blue:#9dc7ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--text); background:radial-gradient(circle at 88% -8%,#1c3c34 0,transparent 32%),radial-gradient(circle at -8% 45%,#15262a 0,transparent 30%),var(--bg); font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; }
    main { width:min(1320px,calc(100% - 32px)); margin:0 auto; padding:30px 0 52px; }
    header { display:flex; justify-content:space-between; align-items:end; gap:18px; margin-bottom:22px; }
    h1 { margin:0; font-size:25px; letter-spacing:-1px; } h1 span { color:var(--green); }
    h2 { margin:0; font-size:14px; color:#c5d1ce; } .sub { color:var(--muted); margin:5px 0 0; }
    .header-meta { display:flex; align-items:end; flex-direction:column; gap:7px; color:var(--muted); font-size:12px; }
    .connection { border:1px solid #315b48; border-radius:999px; padding:4px 9px; color:var(--green); background:#12271d; }
    .connection.bad { color:var(--red); border-color:#633b3b; background:#2b1618; }
    .grid { display:grid; grid-template-columns:380px 1fr; gap:16px; align-items:start; }
    .panel { background:rgba(21,28,31,.94); border:1px solid var(--line); border-radius:12px; padding:18px; box-shadow:0 16px 36px #0003; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
    .toolbar-actions { display:flex; gap:7px; flex-wrap:wrap; justify-content:flex-end; }
    .toolbar button, .secondary { background:transparent; color:var(--green); border:1px solid #35644b; padding:7px 10px; }
    .toolbar button.warn { color:var(--amber); border-color:#66512e; }
    .services { display:grid; gap:9px; }
    .service { display:grid; gap:10px; padding:12px; border:1px solid var(--line); border-radius:9px; background:var(--panel-2); transition:border-color .18s, transform .18s; }
    .service:hover { border-color:#416451; transform:translateY(-1px); }
    .service-top, .service-bottom { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .service-name { color:#edf6f1; font-weight:bold; } .service-stream { color:var(--muted); font-size:11px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px; }
    .state { font-size:12px; white-space:nowrap; } .online { color:var(--green); } .offline { color:var(--red); } .muted { color:var(--muted); }
    .process-state { color:var(--blue); font-size:11px; } .process-state.stopped { color:var(--muted); } .process-state.unmanaged { color:var(--amber); } .process-state.gateway { color:var(--red); }
    .service-actions { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; } .service-actions button { padding:5px 8px; font-size:11px; background:transparent; color:var(--muted); border:1px solid var(--line); } .service-actions button:hover:not(:disabled) { color:var(--green); border-color:#35644b; }
    .service-actions button.primary { color:var(--green); border-color:#35644b; } .service-actions button:disabled { opacity:.35; cursor:not-allowed; }
    .logs { display:none; border-top:1px solid var(--line); padding-top:10px; } .logs.open { display:block; }
    .logs-toolbar { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:7px; } .logs-toolbar button { padding:4px 7px; font-size:11px; }
    .log-output { max-height:180px; font-size:11px; color:#b9c8c4; }
    .field { margin-bottom:13px; } label { display:block; color:var(--muted); font-size:12px; margin:0 0 6px; }
    input,select,textarea { width:100%; color:var(--text); background:#0e1416; border:1px solid var(--line); border-radius:7px; padding:10px 11px; font:inherit; outline:none; } input:focus,select:focus,textarea:focus { border-color:var(--green); box-shadow:0 0 0 2px #6ee7a018; }
    textarea { min-height:98px; resize:vertical; } button { color:#0b1711; background:var(--green); border:0; border-radius:7px; padding:10px 15px; font:inherit; font-weight:bold; cursor:pointer; } button:disabled { opacity:.55; cursor:wait; }
    .request-meta { display:grid; grid-template-columns:1fr 125px; gap:12px; } .rpc-meta { display:grid; grid-template-columns:1fr 1fr 125px; gap:12px; }
    #message, #rpc-message { min-height:22px; color:var(--amber); margin-top:10px; white-space:pre-wrap; }
    .result { border-top:1px solid var(--line); padding:14px 0; } .result:first-child { border-top:0; padding-top:0; }
    .result-head { display:flex; justify-content:space-between; gap:12px; margin-bottom:7px; } .result-url { color:#cce6dc; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .code { color:var(--green); white-space:nowrap; } .code.bad { color:var(--red); }
    pre { max-height:300px; overflow:auto; margin:0; padding:12px; border:1px solid var(--line); border-radius:7px; background:#0b1012; color:#b9c8c4; white-space:pre-wrap; word-break:break-word; }
    .hint { color:var(--muted); font-size:11px; margin:3px 0 0; } .empty { padding:14px 0; }
    .split { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .count { color:var(--muted); font-size:11px; }
    @media (max-width:920px) { .grid,.split{grid-template-columns:1fr}.header-meta{align-items:start;margin-top:16px}header{display:block}.rpc-meta{grid-template-columns:1fr 1fr}.service-stream{max-width:180px} }
    @media (max-width:560px) { main{width:calc(100% - 20px);padding-top:22px}.request-meta,.rpc-meta{grid-template-columns:1fr}.result-head{display:block}.code{display:block;margin-top:4px}.toolbar{align-items:flex-start;flex-direction:column}.toolbar-actions{justify-content:flex-start} }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>WebSupervisor <span>/</span> 控制台</h1><p class="sub">Redis Streams 服务观测、进程控制与 HTTP / RPC 调试入口</p></div>
    <div class="header-meta"><span id="gateway-status" class="connection">● 网关检查中</span><span id="clock"></span><span id="last-refresh" class="hint"></span></div>
  </header>

  <div class="grid">
    <aside class="panel">
      <div class="toolbar"><div><h2>服务状态</h2><div class="hint">每 5 秒自动刷新；仅管理配置中的本地进程</div></div><div class="toolbar-actions"><button id="start-all" type="button">全部启动</button><button id="start-offline" type="button">启动离线</button><button id="restart-all" type="button">全部重启</button><button id="stop-all" class="warn" type="button">全部停止</button><button id="refresh" type="button">刷新</button></div></div>
      <div id="services" class="services"><div class="muted empty">检查中…</div></div>
    </aside>

    <section class="panel">
      <div class="toolbar"><div><h2>抓取页面</h2><div class="hint">请求经 HTTP Gateway 转换为 Redis Streams 调用</div></div></div>
      <form id="crawl-form">
        <div class="field"><label for="url">URL</label><input id="url" type="url" value="https://example.com" required></div>
        <div class="request-meta"><div class="field"><label for="method">方法</label><select id="method"><option>GET</option><option>POST</option></select></div><div></div></div>
        <div class="field"><label for="headers">Headers JSON（可选）</label><textarea id="headers">{}</textarea></div>
        <div class="field"><label for="body">Body JSON（POST 可选）</label><textarea id="body">{}</textarea></div>
        <button id="submit" type="submit">开始抓取</button><div id="message"></div>
      </form>
    </section>
  </div>

  <section class="panel" style="margin-top:16px">
    <div class="toolbar"><div><h2>RPC 调试</h2><div class="hint">等价于直接调用网关 /rpc；返回内容原样展示</div></div><button id="rpc-example" class="secondary" type="button">填入 ping 示例</button></div>
    <form id="rpc-form">
      <div class="rpc-meta"><div class="field"><label for="rpc-stream">Stream</label><input id="rpc-stream" value="dev:crawler-stream" required></div><div class="field"><label for="rpc-service">Service</label><input id="rpc-service" value="ping" required></div><div class="field"><label for="rpc-timeout">Timeout ms</label><input id="rpc-timeout" type="number" min="1000" value="5000"></div></div>
      <div class="field"><label for="rpc-payload">Payload JSON</label><textarea id="rpc-payload">{}</textarea></div>
      <button id="rpc-submit" type="submit">发送 RPC</button><div id="rpc-message"></div>
    </form>
    <pre id="rpc-result" class="empty">暂无 RPC 返回</pre>
  </section>

  <section class="panel" style="margin-top:16px"><div class="toolbar"><div><h2>最近结果</h2><div class="hint">进程内保留最近 20 条</div></div><div class="toolbar-actions"><span id="recent-count" class="count"></span><button id="clear-recent" class="secondary" type="button">清空</button></div></div><div id="recent"><div class="muted empty">暂无记录</div></div></section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels = {running:'进程运行中', stopped:'已停止', not_managed:'外部进程'};
const actionLabels = {start:'启动', stop:'停止', restart:'重启'};
let serviceList = [];
function showClock(){ $('clock').textContent = new Date().toLocaleString('zh-CN',{hour12:false}); }
function setMessage(id, text){ $(id).textContent = text; }
function processText(state){ return labels[state] || state || '检查中'; }
function serviceCard(service){
  const managed = service.managed !== false;
  const externalRunning = service.process === 'not_managed' && service.online;
  const running = service.process === 'running' || externalRunning;
  const gatewayDown = service.health === 'gateway_unavailable';
  const status = service.online ? '● online' : gatewayDown ? '● 网关不可用' : '● offline';
  const processClass = gatewayDown ? 'gateway' : service.process === 'stopped' || !service.online ? 'stopped' : externalRunning ? 'unmanaged' : '';
  const actions = managed ? `<div class="service-actions"><button type="button" class="primary" data-service="${esc(service.name)}" data-action="start" ${running || gatewayDown ? 'disabled' : ''}>启动</button><button type="button" data-service="${esc(service.name)}" data-action="restart" ${externalRunning || gatewayDown ? 'disabled' : ''}>重启</button><button type="button" data-service="${esc(service.name)}" data-action="stop" ${!running || externalRunning ? 'disabled' : ''}>停止</button><button type="button" class="secondary" data-service="${esc(service.name)}" data-action="logs">日志</button></div>` : '<span class="hint">未配置启动命令</span>';
  const note = externalRunning ? '外部进程：请在原启动窗口关闭' : gatewayDown ? service.error || 'HTTP Gateway 不可用，暂时无法完成健康检查' : service.error || '';
  return `<div class="service" data-service-card="${esc(service.name)}"><div class="service-top"><div><div class="service-name">${esc(service.name)}</div><div class="service-stream" title="${esc(service.stream)}">${esc(service.stream)}</div></div><span class="state ${service.online?'online':'offline'}">${status}</span></div><div class="service-bottom"><span class="process-state ${processClass}">${esc(processText(service.process))}</span>${actions}</div>${note ? `<div class="hint">${esc(note)}</div>` : ''}<div class="logs" id="logs-${esc(service.name)}"><div class="logs-toolbar"><span class="hint">最近日志（最多 200 行）</span><div><button type="button" class="secondary" data-service="${esc(service.name)}" data-action="clear-logs">清空</button><button type="button" class="secondary" data-service="${esc(service.name)}" data-action="reload-logs">刷新</button></div></div><pre class="log-output">读取中…</pre></div></div>`;
}
async function api(path, options = {}){
  const response = await fetch(path, options);
  let data = {};
  try { data = await response.json(); } catch (_) { data = {error: await response.text()}; }
  if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
  return data;
}
function updateGatewayBadge(list){
  const gateway = list.find(service => service.name === 'http-gateway');
  const ok = gateway && gateway.online;
  $('gateway-status').textContent = ok ? '● 网关在线' : '● 网关不可用';
  $('gateway-status').classList.toggle('bad', !ok);
}
async function refreshServices(showLoading = true){
  if (showLoading && !$('services').querySelector('.service')) $('services').innerHTML = '<div class="muted empty">检查中…</div>';
  try { serviceList = await api('/api/services'); $('services').innerHTML = serviceList.map(serviceCard).join('') || '<div class="muted empty">未配置服务</div>'; updateGatewayBadge(serviceList); $('last-refresh').textContent = `上次刷新：${new Date().toLocaleTimeString('zh-CN',{hour12:false})}`; }
  catch (e) { $('services').innerHTML = `<div class="offline empty">服务检查失败：${esc(e.message)}</div>`; $('gateway-status').textContent = '● 控制台检查失败'; $('gateway-status').classList.add('bad'); }
}
async function serviceAction(name, action, button){
  button.disabled = true; setMessage('message', `${name} ${actionLabels[action] || action}中…`);
  try { const data = await api(`/api/services/${encodeURIComponent(name)}/${action}`, {method:'POST'}); setMessage('message', `${name}：${actionLabels[action] || action}请求已完成${data.pid ? `（PID ${data.pid}）` : ''}`); await refreshServices(false); }
  catch (e) { setMessage('message', `${name} 操作失败：${e.message}`); await refreshServices(false); }
}
async function batchAction(action, label){
  const buttons = document.querySelectorAll('#start-all,#start-offline,#restart-all,#stop-all,#refresh'); buttons.forEach(button => button.disabled = true); setMessage('message', `${label}中…`);
  try { const data = await api(`/api/services/${action}`, {method:'POST'}); const failed = (data.results || []).filter(item => !item.ok); setMessage('message', failed.length ? `${label}完成，但 ${failed.length} 个服务失败：${failed.map(item => `${item.name}（${item.error}）`).join('；')}` : `${label}完成`); await refreshServices(false); }
  catch (e) { setMessage('message', `${label}失败：${e.message}`); }
  finally { buttons.forEach(button => button.disabled = false); }
}
async function toggleLogs(name, open = true){
  const box = $(`logs-${name}`); if (!box) return; box.classList.toggle('open', open); if (!open) return; await loadLogs(name); }
async function loadLogs(name){
  const box = $(`logs-${name}`); if (!box) return; const output = box.querySelector('.log-output'); output.textContent = '读取中…';
  try { const data = await api(`/api/services/${encodeURIComponent(name)}/logs`); output.textContent = data.lines.length ? data.lines.join('\n') : '暂无日志'; output.scrollTop = output.scrollHeight; }
  catch (e) { output.textContent = `日志读取失败：${e.message}`; }
}
async function refreshRecent(){
  try { const list = await api('/api/recent'); $('recent-count').textContent = `${list.length} / 20`; $('recent').innerHTML = list.length ? list.map(r => `<article class="result"><div class="result-head"><span class="result-url" title="${esc(r.url)}">${esc(r.method)} ${esc(r.url)}</span><span class="code ${r.status >= 400 || r.status === 0 ? 'bad':''}">${esc(r.status)} · ${new Date(r.created_at*1000).toLocaleString('zh-CN',{hour12:false})}</span></div><pre>${esc(r.content)}</pre></article>`).join('') : '<div class="muted empty">暂无记录</div>'; }
  catch (e) { $('recent').innerHTML = `<div class="offline empty">最近结果读取失败：${esc(e.message)}</div>`; }
}
$('refresh').onclick = () => refreshServices();
$('start-all').onclick = () => batchAction('start-all', '全部启动');
$('start-offline').onclick = () => batchAction('start-offline', '启动离线服务');
$('restart-all').onclick = () => { if (confirm('确定重启所有由控制台管理的服务吗？')) batchAction('restart-all', '全部重启'); };
$('stop-all').onclick = () => { if (confirm('确定停止所有由控制台管理的服务吗？')) batchAction('stop-all', '全部停止'); };
$('services').onclick = event => { const button = event.target.closest('button[data-service]'); if (!button) return; const name = button.dataset.service; const action = button.dataset.action; if (action === 'logs') toggleLogs(name); else if (action === 'clear-logs') api(`/api/services/${encodeURIComponent(name)}/logs/clear`, {method:'POST'}).then(() => loadLogs(name)).catch(e => setMessage('message', `清空日志失败：${e.message}`)); else if (action === 'reload-logs') loadLogs(name); else serviceAction(name, action, button); };
$('crawl-form').onsubmit = async event => { event.preventDefault(); const button = $('submit'); button.disabled = true; setMessage('message', '请求中…'); let headers, body; try { headers = JSON.parse($('headers').value || '{}'); body = JSON.parse($('body').value || '{}'); } catch (_) { setMessage('message', 'Headers / Body 必须是有效 JSON'); button.disabled = false; return; } try { const data = await api('/api/crawl',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:$('url').value,method:$('method').value,headers,body})}); setMessage('message', `完成：上游状态 ${data.status}，响应 ${data.content.length} 字符`); await refreshRecent(); } catch (e) { setMessage('message', `失败：${e.message}`); } finally { button.disabled = false; } };
$('rpc-example').onclick = () => { $('rpc-stream').value = 'dev:crawler-stream'; $('rpc-service').value = 'ping'; $('rpc-timeout').value = '5000'; $('rpc-payload').value = '{}'; };
$('rpc-form').onsubmit = async event => { event.preventDefault(); const button = $('rpc-submit'); button.disabled = true; setMessage('rpc-message', '请求中…'); let payload; try { payload = JSON.parse($('rpc-payload').value || '{}'); } catch (_) { setMessage('rpc-message', 'Payload 必须是有效 JSON'); button.disabled = false; return; } try { const data = await api('/api/rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stream:$('rpc-stream').value.trim(),service:$('rpc-service').value.trim(),payload,timeout_ms:Number($('rpc-timeout').value || 5000)})}); $('rpc-result').textContent = JSON.stringify(data,null,2); setMessage('rpc-message','RPC 调用完成'); } catch (e) { $('rpc-result').textContent = e.message; setMessage('rpc-message', `RPC 调用失败：${e.message}`); } finally { button.disabled = false; } };
$('clear-recent').onclick = async () => { if (!confirm('确定清空最近抓取结果吗？')) return; try { await api('/api/recent',{method:'DELETE'}); await refreshRecent(); setMessage('message','最近结果已清空'); } catch (e) { setMessage('message', `清空失败：${e.message}`); } };
showClock(); setInterval(showClock,1000); refreshServices(); refreshRecent(); setInterval(() => refreshServices(false),5000); setInterval(refreshRecent,10000);
</script>
</body>
</html>
