<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebSupervisor 控制台</title>
  <style>
    :root { color-scheme: dark; --bg:#0d1113; --panel:#151c1f; --panel-2:#101618; --line:#29363a; --text:#e8efed; --muted:#8fa19d; --green:#6ee7a0; --amber:#f4c56c; --red:#ff7d7d; --blue:#9dc7ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--text); background:radial-gradient(circle at 88% -8%,#1c3c34 0,transparent 32%),radial-gradient(circle at -8% 45%,#15262a 0,transparent 30%),var(--bg); font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; }
    main { width:min(1240px,calc(100% - 32px)); margin:0 auto; padding:34px 0 52px; }
    header { display:flex; justify-content:space-between; align-items:end; gap:18px; margin-bottom:26px; }
    h1 { margin:0; font-size:25px; letter-spacing:-1px; } h1 span { color:var(--green); }
    h2 { margin:0; font-size:14px; color:#c5d1ce; } .sub { color:var(--muted); margin:5px 0 0; }
    .header-meta { display:flex; align-items:end; flex-direction:column; gap:7px; color:var(--muted); font-size:12px; }
    .connection { border:1px solid #315b48; border-radius:999px; padding:4px 9px; color:var(--green); background:#12271d; }
    .grid { display:grid; grid-template-columns:340px 1fr; gap:16px; align-items:start; }
    .panel { background:rgba(21,28,31,.94); border:1px solid var(--line); border-radius:12px; padding:18px; box-shadow:0 16px 36px #0003; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
    .toolbar button { background:transparent; color:var(--green); border:1px solid #35644b; padding:7px 10px; }
    .services { display:grid; gap:9px; }
    .service { display:grid; gap:10px; padding:12px; border:1px solid var(--line); border-radius:9px; background:var(--panel-2); transition:border-color .18s, transform .18s; }
    .service:hover { border-color:#416451; transform:translateY(-1px); }
    .service-top, .service-bottom { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .service-name { color:#edf6f1; font-weight:bold; } .service-stream { color:var(--muted); font-size:11px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .state { font-size:12px; white-space:nowrap; } .online { color:var(--green); } .offline { color:var(--red); } .muted { color:var(--muted); }
    .process-state { color:var(--blue); font-size:11px; } .process-state.stopped { color:var(--muted); } .process-state.unmanaged { color:var(--amber); }
    .service-actions { display:flex; gap:6px; } .service-actions button { padding:5px 8px; font-size:11px; background:transparent; color:var(--muted); border:1px solid var(--line); } .service-actions button:hover:not(:disabled) { color:var(--green); border-color:#35644b; }
    .service-actions button.primary { color:var(--green); border-color:#35644b; } .service-actions button:disabled { opacity:.35; cursor:not-allowed; }
    .field { margin-bottom:13px; } label { display:block; color:var(--muted); font-size:12px; margin:0 0 6px; }
    input,select,textarea { width:100%; color:var(--text); background:#0e1416; border:1px solid var(--line); border-radius:7px; padding:10px 11px; font:inherit; outline:none; } input:focus,select:focus,textarea:focus { border-color:var(--green); box-shadow:0 0 0 2px #6ee7a018; }
    textarea { min-height:98px; resize:vertical; } button { color:#0b1711; background:var(--green); border:0; border-radius:7px; padding:10px 15px; font:inherit; font-weight:bold; cursor:pointer; } button:disabled { opacity:.55; cursor:wait; }
    .request-meta { display:grid; grid-template-columns:1fr 125px; gap:12px; } .request-meta .field:last-child { margin-bottom:13px; }
    #message { min-height:22px; color:var(--amber); margin-top:10px; white-space:pre-wrap; }
    .result { border-top:1px solid var(--line); padding:14px 0; } .result:first-child { border-top:0; padding-top:0; }
    .result-head { display:flex; justify-content:space-between; gap:12px; margin-bottom:7px; } .result-url { color:#cce6dc; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .code { color:var(--green); white-space:nowrap; } .code.bad { color:var(--red); }
    pre { max-height:300px; overflow:auto; margin:0; padding:12px; border:1px solid var(--line); border-radius:7px; background:#0b1012; color:#b9c8c4; white-space:pre-wrap; word-break:break-word; }
    .hint { color:var(--muted); font-size:11px; margin:3px 0 0; } .empty { padding:14px 0; }
    @media (max-width:820px) { main{width:calc(100% - 20px);padding-top:22px}.grid{grid-template-columns:1fr}.header-meta{align-items:start;margin-top:16px}header{display:block}.request-meta{grid-template-columns:1fr 100px}.result-head{display:block}.code{display:block;margin-top:4px} }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>WebSupervisor <span>/</span> 控制台</h1><p class="sub">Redis Streams 服务观测、进程控制与 HTTP 抓取入口</p></div>
    <div class="header-meta"><span class="connection">● 控制台在线</span><span id="clock"></span></div>
  </header>

  <div class="grid">
    <aside class="panel">
      <div class="toolbar"><div><h2>服务状态</h2><div class="hint">可启动、停止或重启已配置的本地进程</div></div><button id="refresh" type="button">刷新</button></div>
      <div id="services" class="services"><div class="muted empty">检查中…</div></div>
    </aside>

    <section class="panel">
      <div class="toolbar"><div><h2>抓取页面</h2><div class="hint">请求经 HTTP Gateway 转换为 Redis Streams 调用</div></div></div>
      <form id="crawl-form">
        <div class="field"><label for="url">URL</label><input id="url" type="url" value="https://example.com" required></div>
        <div class="request-meta"><div class="field"><label for="method">方法</label><select id="method"><option>GET</option><option>POST</option></select></div><div></div></div>
        <div class="field"><label for="headers">Headers JSON（可选）</label><textarea id="headers">{}</textarea></div>
        <div class="field"><label for="body">Body JSON（POST 可选）</label><textarea id="body">{}</textarea></div>
        <button id="submit" type="submit">开始抓取</button><div id="message"></div>
      </form>
    </section>
  </div>

  <section class="panel" style="margin-top:16px"><div class="toolbar"><h2>最近结果</h2><span class="muted">进程内保留最近 20 条</span></div><div id="recent"><div class="muted empty">暂无记录</div></div></section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const processText = state => ({running:'进程运行中', stopped:'已停止', not_managed:'外部进程'})[state] || state || '检查中';
function showClock(){ $('clock').textContent = new Date().toLocaleString('zh-CN',{hour12:false}); }
function serviceCard(service){
  const managed = service.managed !== false;
  const externalRunning = service.process === 'not_managed' && service.online;
  const running = service.process === 'running' || externalRunning;
  const status = service.online ? '● online' : '● offline';
  const processClass = service.process === 'stopped' || !service.online ? 'stopped' : externalRunning ? 'unmanaged' : '';
  const actions = managed ? `<div class="service-actions"><button type="button" class="primary" data-service="${esc(service.name)}" data-action="start" ${running ? 'disabled' : ''}>启动</button><button type="button" data-service="${esc(service.name)}" data-action="restart" ${externalRunning ? 'disabled' : ''}>重启</button><button type="button" data-service="${esc(service.name)}" data-action="stop" ${!running || externalRunning ? 'disabled' : ''}>停止</button></div>` : '<span class="hint">未配置启动命令</span>';
  const note = externalRunning ? '外部进程：请在原启动窗口关闭' : service.error || '';
  return `<div class="service"><div class="service-top"><div><div class="service-name">${esc(service.name)}</div><div class="service-stream">${esc(service.stream)}</div></div><span class="state ${service.online?'online':'offline'}">${status}</span></div><div class="service-bottom"><span class="process-state ${processClass}">${esc(processText(service.process))}</span>${actions}</div>${note ? `<div class="hint">${esc(note)}</div>` : ''}</div>`;
}
async function refreshServices(){
  $('services').innerHTML = '<div class="muted empty">检查中…</div>';
  try { const response = await fetch('/api/services'); const list = await response.json(); $('services').innerHTML = list.map(serviceCard).join('') || '<div class="muted empty">未配置服务</div>'; }
  catch (e) { $('services').innerHTML = `<div class="offline empty">服务检查失败: ${esc(e.message)}</div>`; }
}
async function serviceAction(name, action, button){
  button.disabled = true; $('message').textContent = `${name} ${action === 'start' ? '启动' : action === 'stop' ? '停止' : '重启'}中…`;
  try { const response = await fetch(`/api/services/${encodeURIComponent(name)}/${action}`, {method:'POST'}); const data = await response.json(); if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`); $('message').textContent = `${name}：${action === 'start' ? '已发送启动请求' : action === 'stop' ? '已停止' : '已重启'}`; await refreshServices(); }
  catch (e) { $('message').textContent = `${name} 操作失败：${e.message}`; await refreshServices(); }
  finally { button.disabled = false; }
}
async function refreshRecent(){
  try { const list = await (await fetch('/api/recent')).json(); $('recent').innerHTML = list.length ? list.map(r => `<article class="result"><div class="result-head"><span class="result-url" title="${esc(r.url)}">${esc(r.method)} ${esc(r.url)}</span><span class="code ${r.status >= 400 || r.status === 0 ? 'bad':''}">${esc(r.status)} · ${new Date(r.created_at*1000).toLocaleString('zh-CN',{hour12:false})}</span></div><pre>${esc(r.content)}</pre></article>`).join('') : '<div class="muted empty">暂无记录</div>'; }
  catch (e) { $('recent').innerHTML = `<div class="offline empty">最近结果读取失败：${esc(e.message)}</div>`; }
}
$('refresh').onclick = refreshServices;
$('services').onclick = event => { const button = event.target.closest('button[data-service]'); if (button) serviceAction(button.dataset.service, button.dataset.action, button); };
$('crawl-form').onsubmit = async event => {
  event.preventDefault(); const button = $('submit'); button.disabled = true; $('message').textContent = '请求中…';
  let headers, body; try { headers = JSON.parse($('headers').value || '{}'); body = JSON.parse($('body').value || '{}'); } catch (e) { $('message').textContent = 'Headers / Body 必须是有效 JSON'; button.disabled = false; return; }
  try { const response = await fetch('/api/crawl',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:$('url').value,method:$('method').value,headers,body})}); const data = await response.json(); if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`); $('message').textContent = `完成：上游状态 ${data.status}`; await refreshRecent(); } catch (e) { $('message').textContent = `失败：${e.message}`; } finally { button.disabled = false; }
};
showClock(); setInterval(showClock,1000); refreshServices(); refreshRecent();
</script>
</body>
</html>
