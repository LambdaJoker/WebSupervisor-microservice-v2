<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebSupervisor 控制台</title>
  <style>
    :root { color-scheme: dark; --bg:#101417; --panel:#171d21; --line:#2b353a; --text:#e8efed; --muted:#91a09d; --green:#6ee7a0; --amber:#f4c56c; --red:#ff7d7d; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--text); background:radial-gradient(circle at 80% -10%,#1b3530 0,transparent 34%),var(--bg); font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; }
    main { width:min(1180px,calc(100% - 32px)); margin:0 auto; padding:34px 0 50px; }
    header { display:flex; justify-content:space-between; align-items:end; gap:18px; margin-bottom:26px; }
    h1 { margin:0; font-size:25px; letter-spacing:-1px; } h1 span { color:var(--green); }
    .sub { color:var(--muted); margin:5px 0 0; }
    .grid { display:grid; grid-template-columns:280px 1fr; gap:16px; } .panel { background:rgba(23,29,33,.92); border:1px solid var(--line); border-radius:12px; padding:18px; box-shadow:0 12px 32px #0002; }
    .panel h2 { margin:0 0 15px; font-size:14px; color:#c5d1ce; } .services { display:grid; gap:9px; }
    .service { display:flex; justify-content:space-between; gap:8px; padding:10px 11px; border:1px solid var(--line); border-radius:8px; background:#11171a; }
    .state { font-size:12px; } .online { color:var(--green); } .offline { color:var(--red); } .muted { color:var(--muted); }
    label { display:block; color:var(--muted); font-size:12px; margin:0 0 6px; } input,select,textarea { width:100%; color:var(--text); background:#0f1417; border:1px solid var(--line); border-radius:7px; padding:10px 11px; font:inherit; outline:none; } input:focus,select:focus,textarea:focus { border-color:var(--green); }
    textarea { min-height:98px; resize:vertical; } .row { display:grid; grid-template-columns:1fr 120px; gap:12px; } .field { margin-bottom:13px; }
    button { color:#0b1711; background:var(--green); border:0; border-radius:7px; padding:10px 15px; font:inherit; font-weight:bold; cursor:pointer; } button:disabled { opacity:.55; cursor:wait; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; } .toolbar button { background:transparent; color:var(--green); border:1px solid #35644b; padding:7px 10px; }
    #message { min-height:22px; color:var(--amber); margin-top:10px; white-space:pre-wrap; } .result { border-top:1px solid var(--line); padding:14px 0; } .result:first-child { border-top:0; padding-top:0; }
    .result-head { display:flex; justify-content:space-between; gap:12px; margin-bottom:7px; } .result-url { color:#cce6dc; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .code { color:var(--green); } .code.bad { color:var(--red); }
    pre { max-height:260px; overflow:auto; margin:0; padding:12px; border:1px solid var(--line); border-radius:7px; background:#0c1113; color:#b9c8c4; white-space:pre-wrap; word-break:break-word; }
    @media (max-width:760px) { main{width:calc(100% - 20px);padding-top:22px}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 100px}header{display:block} }
  </style>
</head>
<body>
<main>
  <header><div><h1>WebSupervisor <span>/</span> 控制台</h1><p class="sub">Redis Streams 服务观测与 HTTP 抓取入口</p></div><div id="clock" class="muted"></div></header>
  <div class="grid">
    <aside class="panel"><div class="toolbar"><h2>服务状态</h2><button id="refresh" type="button">刷新</button></div><div id="services" class="services"><div class="muted">检查中…</div></div></aside>
    <section class="panel">
      <h2>抓取页面</h2>
      <form id="crawl-form">
        <div class="field"><label for="url">URL</label><input id="url" type="url" value="https://example.com" required></div>
        <div class="row"><div class="field"><label for="method">方法</label><select id="method"><option>GET</option><option>POST</option></select></div><div></div></div>
        <div class="field"><label for="headers">Headers JSON（可选）</label><textarea id="headers">{}</textarea></div>
        <div class="field"><label for="body">Body JSON（POST 可选）</label><textarea id="body">{}</textarea></div>
        <button id="submit" type="submit">开始抓取</button><div id="message"></div>
      </form>
    </section>
  </div>
  <section class="panel" style="margin-top:16px"><div class="toolbar"><h2>最近结果</h2><span class="muted">进程内保留最近 20 条</span></div><div id="recent"><div class="muted">暂无记录</div></div></section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showClock(){ $('clock').textContent = new Date().toLocaleString('zh-CN',{hour12:false}); }
async function refreshServices(){
  $('services').innerHTML = '<div class="muted">检查中…</div>';
  try { const list = await (await fetch('/api/services')).json(); $('services').innerHTML = list.map(s => `<div class="service"><span>${esc(s.name)}</span><span class="state ${s.online?'online':'offline'}">${s.online?'● online':'● offline'}</span></div>`).join('') || '<div class="muted">未配置服务</div>'; }
  catch (e) { $('services').innerHTML = `<div class="offline">服务检查失败: ${esc(e.message)}</div>`; }
}
async function refreshRecent(){
  const list = await (await fetch('/api/recent')).json();
  $('recent').innerHTML = list.length ? list.map(r => `<article class="result"><div class="result-head"><span class="result-url" title="${esc(r.url)}">${esc(r.method)} ${esc(r.url)}</span><span class="code ${r.status >= 400 || r.status === 0 ? 'bad':''}">${esc(r.status)} · ${new Date(r.created_at*1000).toLocaleString('zh-CN',{hour12:false})}</span></div><pre>${esc(r.content)}</pre></article>`).join('') : '<div class="muted">暂无记录</div>';
}
$('refresh').onclick = refreshServices;
$('crawl-form').onsubmit = async event => {
  event.preventDefault(); const button = $('submit'); button.disabled = true; $('message').textContent = '请求中…';
  let headers, body; try { headers = JSON.parse($('headers').value || '{}'); body = JSON.parse($('body').value || '{}'); } catch (e) { $('message').textContent = 'Headers / Body 必须是有效 JSON'; button.disabled = false; return; }
  try { const response = await fetch('/api/crawl',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:$('url').value,method:$('method').value,headers,body})}); const data = await response.json(); if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`); $('message').textContent = `完成：上游状态 ${data.status}`; await refreshRecent(); } catch (e) { $('message').textContent = `失败：${e.message}`; } finally { button.disabled = false; }
};
showClock(); setInterval(showClock,1000); refreshServices(); refreshRecent();
</script>
</body>
</html>
